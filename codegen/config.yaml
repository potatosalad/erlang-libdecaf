# yaml-language-server: $schema=./schema.json

---
nif:
  atoms:
    - "badarg"
    - "error"
    - "false"
    - "nil"
    - "no_context"
    - "notsup"
    - "ok"
    - "true"
    - "undefined"
  hash:
    - sha2_512
    - sha3_224
    - sha3_256
    - sha3_384
    - sha3_512
    - keccak_224
    - keccak_256
    - keccak_384
    - keccak_512
  xof:
    - shake128
    - shake256
