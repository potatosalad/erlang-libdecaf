name: CI

on: [push, pull_request]

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27.0'
      - name: Build
        run: make -j2
      - name: Test
        run: make tests
      - name: Documentation
        if: matrix.otp == '29'
        run: make docs
      - name: Logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ct-logs-${{ matrix.otp }}
          path: logs/*
